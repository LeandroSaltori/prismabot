name: Sync Docs from Source

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly at 3 AM UTC on Sunday
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests markdownify

      - name: Run Update Script
        run: |
          python scripts/update_docs.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Prismabot Auto-Sync"
          git config --global user.email "bot@prismatelecomservicos.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "build: auto-update docs and branding [skip ci]"
            git push
          else
            echo "No changes detected."
          fi
